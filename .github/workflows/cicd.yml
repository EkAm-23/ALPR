name: ALPR CI/CD Pipeline

on:
  push:
    branches: [LoRA, main]
  pull_request:
    branches: [LoRA, main]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1 — Tests (runs on GitHub-hosted cloud runner)
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ALPR-app/backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          # Install only the lightweight deps needed for pure-Python tests
          # Heavy ML libs (torch, transformers) are mocked in tests/
          pip install fastapi uvicorn celery redis pillow numpy python-multipart prometheus-client


      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy (runs on your Mac via the self-hosted runner)
  # Only executes on pushes to the LoRA branch, not on PRs
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Local Stack
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/LoRA' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start Docker Compose app
        working-directory: ALPR-app
        run: |
          docker compose up -d --build
          echo "✅ Docker Compose services started"

      - name: Verify backend is healthy
        working-directory: ALPR-app
        run: |
          echo "Waiting 15s for containers to initialise..."
          sleep 15
          docker compose ps
          # Hard-fail if backend or worker containers are not Up
          docker compose ps backend | grep -q "Up" || { echo "❌ backend is DOWN"; exit 1; }
          docker compose ps worker  | grep -q "Up" || { echo "❌ worker is DOWN";  exit 1; }
          echo "✅ All required containers are healthy"

      - name: Stop any existing auto-retrain daemon
        run: |
          if [ -f /tmp/alpr_retrain.pid ]; then
            OLD_PID=$(cat /tmp/alpr_retrain.pid)
            if kill -0 "$OLD_PID" 2>/dev/null; then
              echo "Stopping previous daemon (PID $OLD_PID)..."
              kill "$OLD_PID"
              sleep 2
            fi
          fi
          # Fallback: kill by script name
          pkill -f "auto_retrain.py" || true
          sleep 1

      - name: Start MLOps auto-retrain daemon
        run: |
          mkdir -p /Users/ekamsinghsethi/Desktop/DEP/logs
          LOG=/Users/ekamsinghsethi/Desktop/DEP/logs/auto_retrain.log
          SCRIPT=/Users/ekamsinghsethi/Desktop/DEP/scripts/auto_retrain.py
          PYTHON=/Users/ekamsinghsethi/miniconda3/envs/dep/bin/python

          # Use python to double-fork the daemon so it fully detaches from
          # the runner shell. Plain nohup is unreliable on macOS once the
          # parent shell exits.
          $PYTHON -c "
          import os, sys, subprocess
          log    = '/Users/ekamsinghsethi/Desktop/DEP/logs/auto_retrain.log'
          script = '/Users/ekamsinghsethi/Desktop/DEP/scripts/auto_retrain.py'
          python = '/Users/ekamsinghsethi/miniconda3/envs/dep/bin/python'
          pid = os.fork()
          if pid > 0: sys.exit(0)
          os.setsid()
          pid = os.fork()
          if pid > 0:
              open('/tmp/alpr_retrain.pid','w').write(str(pid))
              sys.exit(0)
          flog = open(log, 'a')
          subprocess.run([python, script], stdout=flog, stderr=flog)
          "

          sleep 3
          DAEMON_PID=$(cat /tmp/alpr_retrain.pid 2>/dev/null || echo "")
          if [ -n "$DAEMON_PID" ] && kill -0 "$DAEMON_PID" 2>/dev/null; then
            echo "✅ Daemon is running with PID $DAEMON_PID"
          else
            echo "❌ Daemon failed to start. Last log:"
            tail -20 /Users/ekamsinghsethi/Desktop/DEP/logs/auto_retrain.log
            exit 1
          fi

      - name: Print deployment summary
        run: |
          echo "=============================================="
          echo "  ALPR Deployment Complete"
          echo "  Model Version: $(cat model_version.txt)"
          echo "  Frontend:   http://localhost:8080"
          echo "  Backend API: http://localhost:8000/docs"
          echo "  Prometheus:  http://localhost:9090"
          echo "  Grafana:     http://localhost:3000"
          echo "  Retrain log: /Users/ekamsinghsethi/Desktop/DEP/logs/auto_retrain.log"
          echo "=============================================="
